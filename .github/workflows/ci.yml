name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: "Python 3.11 — pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt 2>/dev/null || true
          pip install fastapi pydantic lightgbm scikit-learn 2>/dev/null || true

      - name: 运行测试
        run: |
          pytest tests/ -q --tb=short -x 2>&1 || true
        continue-on-error: true

      - name: 运行核心测试（无重依赖）
        run: |
          pytest tests/ -q --tb=short \
            -k "laya or schedule or plan or manifest or checkpoint or signal or decision or tv or pine or png" \
            --cov=src --cov-report=term-missing 2>&1

  lint:
    name: "ruff lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 ruff
        run: pip install ruff

      - name: 代码规范检查
        run: ruff check src/ tests/ --select E,F,W --ignore E501 || true
        continue-on-error: true